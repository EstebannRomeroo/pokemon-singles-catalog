<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYX · Cartas Pokémon en venta</title>
<link rel="icon" href="assets/favicon.png">
<style>
  /* Strict palette, light catalog. Dark band carries the brand (logo blends into #0E2A23);
     the catalog body is a light tint of #D5F4E6 so cards and art breathe.
     Roles: dark = text, deep = secondary text and price, green = buttons, mint = chips/borders,
     lime = hover. Green, mint and lime are never text on light (all < 2.5:1). */
  :root {
    --ink: #0E2A23; --deep: #1B4D3E; --green: #2ECC71; --mint: #1ABC9C; --pale: #D5F4E6; --lime: #7CB342;
    --page: color-mix(in srgb, #D5F4E6 45%, #FFF); --card: color-mix(in srgb, #D5F4E6 12%, #FFF);
    --line: color-mix(in srgb, #1ABC9C 30%, #FFF);
    --radius: 14px; --ease: cubic-bezier(.25, 1, .5, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--page); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  .band { background: var(--ink); color: var(--pale); }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 20px; padding-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  /* Logo has an opaque black background; lighten blends it into the dark band. */
  .logo { width: 84px; height: auto; mix-blend-mode: lighten; flex: none; }
  h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; letter-spacing: -.01em; }
  .meta { margin: 4px 0 0; color: var(--mint); font-size: .9rem; }
  main.wrap { padding-bottom: 48px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; padding: 24px 0 20px; border-bottom: 1px solid var(--line); }
  .controls label { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--deep); flex: 1 1 160px; min-width: 0; }
  .controls label:first-child { flex: 2 1 240px; }
  input, select, button { font: inherit; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); transition: border-color .2s var(--ease), background-color .2s var(--ease); }
  input, select { font-weight: 400; width: 100%; min-width: 0; }
  input::placeholder { color: var(--deep); opacity: .7; }
  input:hover, select:hover { border-color: var(--lime); }
  :focus-visible { outline: 2px solid var(--deep); outline-offset: 2px; }
  .band :focus-visible { outline-color: var(--lime); }
  button { cursor: pointer; font-weight: 600; }
  .status { margin: 20px 0 16px; color: var(--deep); font-size: .9rem; }
  .status button { margin-left: 8px; }
  .status button:hover { border-color: var(--lime); }
  .grid { list-style: none; padding: 0; margin: 0; display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgb(14 42 35 / .06); transition: border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease); }
  .card:hover { border-color: var(--lime); transform: translateY(-3px); box-shadow: 0 10px 24px -12px rgb(14 42 35 / .35); }
  .art { display: block; border-radius: 9px; }
  .art img { display: block; width: 100%; height: auto; aspect-ratio: 245 / 342; border-radius: 9px; background: var(--pale); }
  .card h2 { font-size: 1.05rem; line-height: 1.3; margin: 14px 0 0; }
  .set { margin: 2px 0 0; font-size: .85rem; color: var(--deep); }
  .tags { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 10px 0 0; }
  .tags li { font-size: .75rem; line-height: 1; padding: 5px 8px; border-radius: 999px; background: color-mix(in srgb, #1ABC9C 14%, #FFF); color: var(--deep); }
  .buy { margin-top: auto; padding-top: 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .price { font-size: 1.3rem; font-weight: 750; color: var(--deep); font-variant-numeric: tabular-nums; }
  .stock { font-size: .8rem; color: var(--deep); white-space: nowrap; }
  .note { margin: 6px 0 0; font-size: .75rem; color: var(--deep); }
  .pdf, .want { background: var(--green); border: 1px solid var(--green); color: var(--ink); font-weight: 600; }
  .pdf { padding: 0 18px; }
  .pdf:hover, .want:hover { background: var(--lime); border-color: var(--lime); }
  .pdf:disabled { opacity: .6; cursor: progress; }
  .want { margin-top: 12px; width: 100%; display: flex; align-items: center; justify-content: center; text-decoration: none; min-height: 44px; border-radius: 10px; transition: background-color .2s var(--ease); }
  .toast { position: fixed; left: 50%; bottom: 24px; translate: -50% 0; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 10px; background: var(--ink); color: var(--pale); font-size: .9rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); }
  .toast.show { opacity: 1; }
  footer.wrap { padding-bottom: 40px; font-size: .8rem; color: var(--deep); }
  .print-only { display: none; }
  @media (max-width: 480px) {
    .header-row { padding-top: 16px; padding-bottom: 16px; }
    .logo { width: 56px; }
    h1 { font-size: 1.3rem; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 16px; }
    .controls label:first-child { grid-column: 1 / -1; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { padding: 8px; }
    .card h2 { font-size: .95rem; margin-top: 10px; }
    .price { font-size: 1.1rem; }
    .buy { flex-direction: column; align-items: flex-start; gap: 2px; }
  }
  @media print {
    @page { size: A4; margin: 0; }
    html, body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    .wrap { max-width: none; padding: 0 10mm; }
    .header-row { padding-top: 8mm; padding-bottom: 6mm; }
    .controls, .pdf, .status, .note, .want, .toast { display: none; }
    .logo { width: 64px; }
    main.wrap { padding-top: 6mm; padding-bottom: 0; }
    .grid { grid-template-columns: repeat(4, 1fr); gap: 4mm; }
    .card { break-inside: avoid; transform: none !important; box-shadow: none; padding: 2.5mm; }
    .card h2 { font-size: .85rem; margin-top: 2mm; }
    .set, .stock { font-size: .7rem; }
    .tags li { font-size: .6rem; padding: 3px 6px; }
    .price { font-size: 1rem; }
    .buy { flex-direction: column; align-items: flex-start; gap: 0; padding-top: 2mm; }
    footer.wrap { padding-top: 6mm; }
    .print-only { display: block; margin-top: 2mm; font-weight: 600; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .card:hover { transform: none; } }
</style>
</head>
<body>
<header class="band">
  <div class="header-row wrap">
    <div class="brand">
      <img class="logo" src="assets/logo.webp" alt="NYX" width="320" height="292">
      <div>
        <h1>Cartas Pokémon en venta</h1>
        <p class="meta" id="updated">Precios en pesos colombianos</p>
      </div>
    </div>
    <button class="pdf" id="pdf" type="button">Descargar PDF</button>
  </div>
</header>
<main class="wrap">
  <div class="controls">
    <label>Buscar
      <input id="search" type="search" placeholder="Nombre o expansión" autocomplete="off">
    </label>
    <label>Rareza
      <select id="rarity"><option value="">Todas</option></select>
    </label>
    <label>Ordenar
      <select id="sort">
        <option value="price-desc">Precio: mayor a menor</option>
        <option value="price-asc">Precio: menor a mayor</option>
        <option value="name">Nombre</option>
      </select>
    </label>
  </div>
  <p class="status" id="status" role="status">Cargando catálogo…</p>
  <ul class="grid" id="grid"></ul>
</main>
<footer class="wrap">Precios de referencia basados en el mercado (TCGPlayer), convertidos a COP.<span class="print-only" id="site"></span></footer>
<p class="toast" id="toast" role="status"></p>
<script>
  // WhatsApp Business short link (Settings → Business tools → Short link). It hides the number from the page;
  // buyers still see it once they write. Empty = no "Lo quiero" button.
  const WHATSAPP_LINK = '';
  const cop = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
  const $ = (id) => document.getElementById(id);
  let items = [];
  const VARIANTS = { normal: 'Normal', holofoil: 'Holo', reverseHolofoil: 'Reverse Holo', '1stEditionHolofoil': '1ra edición Holo', '1stEditionNormal': '1ra edición' };
  const variantLabel = (v) => VARIANTS[v] ?? v;
  const CONDITIONS = { NM: 'Near Mint', LP: 'Lightly Played', MP: 'Moderately Played', HP: 'Heavily Played', DMG: 'Damaged' };
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  function el(tag, props = {}, text) {
    const node = Object.assign(document.createElement(tag), props);
    if (text != null) node.textContent = text;
    return node;
  }

  function renderCard(item) {
    const art = el('a', { className: 'art', href: item.imageLarge || item.image, target: '_blank', rel: 'noopener' });
    art.setAttribute('aria-label', `Ver ${item.name} en tamaño grande`);
    art.append(el('img', { src: item.image, alt: `Carta ${item.name}`, loading: 'lazy', width: 245, height: 342 }));
    const tags = el('ul', { className: 'tags' });
    const condition = el('li', { title: CONDITIONS[item.condition] ?? '' }, item.condition);
    tags.append(...[item.rarity, item.variant && variantLabel(item.variant)].filter(Boolean).map((t) => el('li', {}, t)), condition);
    const buy = el('div', { className: 'buy' });
    buy.append(el('span', { className: 'price' }, cop.format(item.priceCop)), el('span', { className: 'stock' }, plural(item.qty, 'disponible', 'disponibles')));
    const li = el('li', { className: 'card' });
    li.append(
      art,
      el('h2', {}, item.name),
      el('p', { className: 'set' }, `${item.set} · #${item.number}`),
      tags,
      buy,
      WHATSAPP_LINK ? wantButton(item) : '',
      item.priceVariant && item.priceVariant !== item.variant && !item.manual
        ? el('p', { className: 'note' }, `Precio de referencia: ${variantLabel(item.priceVariant)}`)
        : '',
    );
    return li;
  }

  // Short links can't carry a per-card message, so copy it and let the buyer paste it.
  function wantButton(item) {
    const msg = `Hola, me interesa ${item.name} (${item.set} #${item.number}) a ${cop.format(item.priceCop)}`;
    const a = el('a', { className: 'want', href: WHATSAPP_LINK, target: '_blank', rel: 'noopener' }, 'Lo quiero');
    a.addEventListener('click', () => {
      navigator.clipboard?.writeText(msg).then(() => toast('Mensaje copiado. Pégalo en el chat de WhatsApp.'), () => {});
    });
    return a;
  }

  let toastTimer;
  function toast(text) {
    $('toast').textContent = text;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
  }

  function render() {
    const q = $('search').value.trim().toLowerCase();
    const rarity = $('rarity').value;
    const sort = $('sort').value;
    const list = items
      .filter((i) => !q || i.name.toLowerCase().includes(q) || i.set.toLowerCase().includes(q))
      .filter((i) => !rarity || i.rarity === rarity)
      .sort((a, b) => sort === 'name' ? a.name.localeCompare(b.name, 'es')
        : sort === 'price-asc' ? a.priceCop - b.priceCop : b.priceCop - a.priceCop);
    $('grid').replaceChildren(...list.map(renderCard));
    const status = $('status');
    if (list.length) { status.textContent = plural(list.length, 'carta', 'cartas'); return; }
    const clear = el('button', { type: 'button' }, 'Limpiar filtros');
    clear.addEventListener('click', () => { $('search').value = ''; $('rarity').value = ''; render(); $('search').focus(); });
    status.replaceChildren('Ninguna carta coincide con tu búsqueda.', clear);
  }

  // ponytail: browser "Save as PDF" via print CSS; the PDF shows the current filters and order.
  $('site').textContent = `Catálogo actualizado: ${location.origin}${location.pathname}`;
  $('pdf').addEventListener('click', async () => {
    $('pdf').disabled = true;
    const imgs = [...document.querySelectorAll('.grid img')];
    imgs.forEach((img) => { img.loading = 'eager'; });
    await Promise.all(imgs.map((img) => img.decode().catch(() => {})));
    $('pdf').disabled = false;
    print();
  });

  fetch('catalog.json')
    .then((res) => { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then((catalog) => {
      items = catalog.items;
      const date = new Date(catalog.generatedAt).toLocaleDateString('es-CO', { dateStyle: 'long' });
      $('updated').textContent = `Precios en pesos colombianos · actualizados el ${date}`;
      const rarities = [...new Set(items.map((i) => i.rarity).filter(Boolean))].sort();
      $('rarity').append(...rarities.map((r) => el('option', { value: r }, r)));
      for (const id of ['search', 'rarity', 'sort']) $(id).addEventListener('input', render);
      render();
    })
    .catch(() => { $('status').textContent = 'No se pudo cargar el catálogo. Recarga la página en unos minutos.'; });
</script>
</body>
</html>
